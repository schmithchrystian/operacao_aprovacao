services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: study_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: study_test
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - study-test-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U study_test -d study_test']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  study-test-data:
